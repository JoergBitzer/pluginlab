# CI: build, run the tests and validate the loader plugin with pluginval on Linux, Windows and macOS.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  LOADER_VST3: build/plugins/loader/PluginLabLoader_artefacts/Release/VST3/PluginLabLoader.vst3

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            # older Ubuntu = older glibc
            os: ubuntu-22.04
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev \
            libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libxi-dev \
            libglu1-mesa-dev mesa-common-dev xvfb openbox

      - name: Configure
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel 4

      # pluginval first: the scripts download it (tools/run_pluginval.*), the validator tests of PluginLabTests then find it
      # and must not be skipped (PLUGINLAB_REQUIRE_PLUGINVAL)
      - name: Validate the loader plugin with pluginval (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a tools/run_pluginval.sh "$LOADER_VST3" 1

      - name: Validate the loader plugin with pluginval (macOS)
        if: runner.os == 'macOS'
        run: tools/run_pluginval.sh "$LOADER_VST3" 1

      - name: Validate the loader plugin with pluginval (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: tools/run_pluginval.ps1 "$env:LOADER_VST3" 1

      # PluginLabTests (juce::UnitTest), the end-to-end report of the host and the smoke test of PluginLabHost
      - name: Test (Linux)
        if: runner.os == 'Linux'
        env:
          PLUGINLAB_REQUIRE_PLUGINVAL: "1"
        # a window manager (openbox) runs in the virtual display: VST2 editors (XEmbed) need atoms that only exist then;
        # without it the hosted VST2 editor dies with an X "BadAtom" error
        run: xvfb-run -a bash -c 'openbox & sleep 2; ctest --test-dir build -C Release --output-on-failure'

      - name: Test (Windows, macOS)
        if: runner.os != 'Linux'
        shell: bash
        env:
          PLUGINLAB_REQUIRE_PLUGINVAL: "1"
        run: ctest --test-dir build -C Release --output-on-failure
