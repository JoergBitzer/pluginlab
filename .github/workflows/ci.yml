# CI: build, run the tests and validate the loader plugin with pluginval on Windows and macOS (Linux is the development machine).
# It does not run on a normal push. It runs
#  - when a tag vX.Y.Z is pushed that matches project(pluginlab VERSION X.Y.Z) in CMakeLists.txt (a tag that does not match
#    stops the run before anything is built), or
#  - with the "Run workflow" button on the Actions page (no tag check).
name: CI

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

env:
  LOADER_VST3: build/plugins/loader/PluginLabLoader_artefacts/Release/VST3/PluginLabLoader.vst3

jobs:
  check-version:
    name: Tag matches the version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare the tag with the version in CMakeLists.txt
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/^project(pluginlab VERSION \([0-9.]*\)).*/\1/p' CMakeLists.txt)
          echo "tag ${GITHUB_REF_NAME}, CMakeLists version ${version}"
          test "${GITHUB_REF_NAME}" = "v${version}"

  build-and-test:
    name: ${{ matrix.name }}
    needs: check-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel 4

      # pluginval first: the scripts download it (tools/run_pluginval.*), the validator tests of PluginLabTests then find it
      # and must not be skipped (PLUGINLAB_REQUIRE_PLUGINVAL)
      - name: Validate the loader plugin with pluginval (macOS)
        if: runner.os == 'macOS'
        run: tools/run_pluginval.sh "$LOADER_VST3" 1

      - name: Validate the loader plugin with pluginval (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: tools/run_pluginval.ps1 "$env:LOADER_VST3" 1

      # PluginLabTests (juce::UnitTest), the end-to-end report of the host and the smoke test of PluginLabHost
      - name: Test
        shell: bash
        env:
          PLUGINLAB_REQUIRE_PLUGINVAL: "1"
        run: ctest --test-dir build -C Release --output-on-failure
