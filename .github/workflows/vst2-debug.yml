# Debugging aid: builds only the scanner and the VST2 test plugin with debug symbols and runs the scanner on the VST2 plugin
# under a debugger (lldb on macOS, cdb on Windows) to get a stack trace of a crash. Start it with "Run workflow".
name: VST2 debug

on:
  workflow_dispatch:
    inputs:
      os:
        description: 'Runner (windows-latest, macos-latest, ubuntu-22.04)'
        default: 'macos-latest'
      build_type:
        description: 'CMake build type (RelWithDebInfo has symbols; Release is what CI uses)'
        default: 'RelWithDebInfo'

jobs:
  debug:
    runs-on: ${{ github.event.inputs.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libxi-dev \
            libglu1-mesa-dev mesa-common-dev xvfb gdb

      - name: Configure
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ github.event.inputs.build_type }}

      - name: Build scanner and VST2 test plugin
        shell: bash
        run: cmake --build build --config ${{ github.event.inputs.build_type }} --parallel 4 --target PluginLabScanner PluginLabTestGain_VST

      - name: Scan the VST2 plugin on macOS, plain run and then under lldb
        if: runner.os == 'macOS'
        shell: bash
        run: |
          scanner=$(find build/apps/scanner -name PluginLabScanner -type f | head -1)
          plugin=$PWD/build/test_plugins/PluginLabTestGain.vst
          echo "--- plain run"
          "$scanner" "$plugin" /tmp/scan_result_plain.xml || echo "plain run failed with exit code $?"
          printf 'run\nbt all\nregister read pc\nquit\n' > /tmp/lldb_commands.txt
          echo "--- lldb"
          lldb -s /tmp/lldb_commands.txt -- "$scanner" "$plugin" /tmp/scan_result.xml 2>&1 | head -150 || true

      - name: Scan the VST2 plugin on Windows, plain run and then under cdb with page heap
        if: runner.os == 'Windows'
        shell: bash
        run: |
          scanner=$(find build/apps/scanner -name PluginLabScanner.exe -type f | head -1)
          plugin=$PWD/build/test_plugins/PluginLabTestGain.dll
          export MSYS_NO_PATHCONV=1   # Git Bash would turn /p into a path
          echo "--- plain run (no debugger)"
          "$scanner" "$plugin" "C:\\Temp\\scan_result_plain.xml" || echo "plain run failed with exit code $?"
          debuggers="/c/Program Files (x86)/Windows Kits/10/Debuggers/x64"
          echo "--- enabling page heap for the scanner (finds heap overruns at the faulty write)"
          "$debuggers/gflags.exe" /p /enable PluginLabScanner.exe /full || true
          echo "--- cdb"
          "$debuggers/cdb.exe" -g -G -c "g;.lines;kb 60;q" "$scanner" "$plugin" "C:\\Temp\\scan_result.xml" 2>&1 | grep -v "ModLoad\|NatVis" | head -150 || true
          "$debuggers/gflags.exe" /p /disable PluginLabScanner.exe || true

      - name: Scan the VST2 plugin under gdb (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          scanner=$(find build/apps/scanner -name PluginLabScanner -type f | head -1)
          plugin=$(ls build/test_plugins/*PluginLabTestGain*.so | head -1)
          xvfb-run -a gdb -batch -ex run -ex bt --args "$scanner" "$plugin" /tmp/scan_result.xml || true
