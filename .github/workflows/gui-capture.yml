# Trial of the GUI review (W5d, docs/design/W5d-gui-review.md) on Windows and macOS: can the editor of a hosted plugin be captured there?
# Builds only the host and the plugins with editors, runs "PluginLabHost --gui-snapshot" on the Reference EQ and the three test editors of W5d.3,
# prints the reviews and uploads the images as an artifact. Start it with "Run workflow" (no tag, no release).
name: GUI capture trial

on:
  workflow_dispatch:

jobs:
  capture:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            host: build/apps/host/PluginLabHost_artefacts/Release/PluginLabHost.exe
          - name: macOS
            os: macos-latest
            host: build/apps/host/PluginLabHost_artefacts/Release/PluginLabHost.app/Contents/MacOS/PluginLabHost

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build the host and the plugins with editors
        shell: bash
        run: >
          cmake --build build --config Release --parallel 4 --target PluginLabHost PluginLabReferenceEq_VST3
          PluginLabTestEditorScales_VST3 PluginLabTestEditorIgnoresScale_VST3 PluginLabTestEditorSizeOnly_VST3

      - name: Capture the editors
        shell: bash
        timeout-minutes: 15
        run: |
          mkdir -p gui_capture
          "${{ matrix.host }}" --gui-snapshot build/plugins/reference/PluginLabReferenceEq_artefacts/Release/VST3/PluginLabReferenceEq.vst3 gui_capture/ReferenceEq || echo "ReferenceEq: exit $?"
          for name in EditorScales EditorIgnoresScale EditorSizeOnly; do
            "${{ matrix.host }}" --gui-snapshot "build/test_plugins/PluginLabTest${name}.vst3" "gui_capture/${name}" || echo "${name}: exit $?"
          done
          for review in gui_capture/*/gui_review.md; do echo "===== ${review}"; cat "${review}"; done

      - name: Upload the captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-capture-${{ matrix.name }}
          path: gui_capture
